data_platform_starter:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', 'data/warehouse.duckdb') }}"
      threads: 4
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'data_platform_starter') }}"
      threads: 4
